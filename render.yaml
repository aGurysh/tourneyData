# Private preview environment
services:
  - type: web
    name: tourney-preview
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    numInstances: 1
    dockerfilePath: ./App/deploy/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    preDeployCommand: .venv/bin/python -m backend.db.migrate
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATABASE_URL
        sync: false # internal connection using the restricted API login
      - key: MIGRATION_DATABASE_URL
        sync: false # internal connection using the existing schema owner
      - key: DEPLOYMENT_ACCESS
        value: private
      - key: PREVIEW_USERNAME
        sync: false
      - key: PREVIEW_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: ""

databases:
  - name: tourney-preview-db
    plan: 0.1c-256mb
    region: virginia
    postgresMajorVersion: "18"
    databaseName: tourney
    user: tourney_owner
    diskSizeGB: 1
    storageAutoscalingEnabled: false
    ipAllowList: [] # prefer setting ip for ingestion from render dashboard
