[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tourney-analytics-backend"
version = "0.1.0"
description = "Database foundation for the fishing tournament analytics app"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["tourney_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
